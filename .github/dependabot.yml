version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # 5.x removed the Haar face detector the reframing uses
      - dependency-name: opencv-python-headless
        versions: [">=5"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native rewrite) can't load next.config.ts with Next 15 yet: the build fails
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
